# Update the evmac/bake Homebrew tap when a new release is published.
# Requires repo secret: HOMEBREW_TAP_TOKEN (PAT with Contents read/write on evmac/homebrew-bake).
#
# Copies packaging/homebrew-bake.rb (full formula) so the tap never accumulates merge
# conflict markers from partial sed edits.

name: Update Homebrew tap

on:
  release:
    types: [published]

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout go-bake
        uses: actions/checkout@v4

      - name: Get version and tarball URL
        id: release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tarball_url=https://github.com/evmac/go-bake/archive/refs/tags/${TAG}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256
        id: sha
        run: |
          SHA256=$(curl -sL "${{ steps.release.outputs.tarball_url }}" | shasum -a 256 | awk '{print $1}')
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Clone homebrew-bake
        run: |
          git clone --depth 1 \
            "https://github.com/evmac/homebrew-bake.git" \
            homebrew-bake

      - name: Write formula (from template, no partial sed on dirty files)
        env:
          TAG: ${{ steps.release.outputs.tag }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd homebrew-bake
          FORMULA="Formula/bake.rb"
          cp "${{ github.workspace }}/packaging/homebrew-bake.rb" "$FORMULA"
          sed -i "s|TAG_PLACEHOLDER|${TAG}|g" "$FORMULA"
          sed -i "s|SHA256_PLACEHOLDER|${SHA256}|g" "$FORMULA"

      - name: Commit and push
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          cd homebrew-bake
          git config user.name "bake-release[bot]"
          git config user.email "bake-release[bot]@users.noreply.github.com"
          git add Formula/bake.rb
          git diff --staged --quiet && echo "No formula changes" && exit 0
          git commit -m "bake ${{ steps.release.outputs.tag }}"
          BRANCH=$(git symbolic-ref --short HEAD)
          git push "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/evmac/homebrew-bake.git" HEAD:"${BRANCH}"
