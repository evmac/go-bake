# Run the bake ci suite (format.check + test.cover). Uses the project's own Bakefile and suite.
name: CI

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["*"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Set up Bake
        run: |
          go build -o bin/bake ./cmd/bake
          ./bin/bake install
          echo "${{ github.workspace }}/.bake/bin" >> $GITHUB_PATH

      - name: Run CI suite
        run: ci
        env:
          GOMEMLIMIT: 1GiB
        timeout-minutes: 15

      - name: Upload coverage
        if: env.ACTIONS_RUNTIME_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
