# Format check + test with coverage (same as `bake ci`), but split so we can tune timeouts.
# Do not set GOMAXPROCS=2 here: it makes `go test ./...` many times slower on CI.
name: CI

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["*"]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Smoke build bake
        run: go build -o bin/bake ./cmd/bake

      - name: Format check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files need formatting:"
            gofmt -l .
            exit 1
          fi

      - name: Test with coverage
        run: go test ./... -count=1 -coverprofile=coverage.out -timeout=60m
        timeout-minutes: 90

      - name: Upload coverage
        if: env.ACTIONS_RUNTIME_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
